[project]
name = "simple-agent-template"
version = "0.4.1"
description = "Minimal LangChain agent template for LangGraph deployment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.10",
    "langchain-openai>=1.6.0,<2.0.0",
    "langgraph>=1.0.0",
    "langgraph-cli[inmem]>=0.4.10",
    "langgraph-api>=0.14.0,<0.15.0",
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.2,<7",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "pytest>=9.0.3",
    "ruff>=0.8.0",
    "pytest-cov>=6",
]

[tool.uv.build-backend]
module-name = "simple_agent"
source-include = ["langgraph.json", ".env.example", "Makefile", "tests/**"]
